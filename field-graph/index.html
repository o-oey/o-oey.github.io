<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Interactive 2D and 3D function grapher with zoom, orbit, and live readouts." />
  <meta name="theme-color" content="#efe8d8" />
  <title>Field Graph</title>
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <header>
    <h1>Field Graph</h1>
    <div class="modes">
      <button type="button" id="mode2" class="on">2D y = f(x)</button>
      <button type="button" id="mode3">3D z = f(x, y)</button>
    </div>
    <div class="meta" id="hintbar">scroll zoom · drag pan</div>
  </header>
  <div class="stage" id="stage">
    <canvas id="g"></canvas>
    <div class="readout" id="out">Ready</div>
    <aside class="dock">
      <div class="fn"><input id="expr" spellcheck="false" value="sin(x)*cos(y)" /></div>
      <div class="chips" id="ex"></div>
      <label class="row"><span>Resolution</span><span id="resVal">32</span></label>
      <input id="res" type="range" min="12" max="56" value="32" />
      <label class="row"><span>Domain</span><span id="domVal">±4</span></label>
      <input id="dom" type="range" min="2" max="10" value="4" />
      <div class="tools">
        <button type="button" id="home">reset view</button>
      </div>
      <div class="err" id="err"></div>
      <div class="hint" id="help">Drag to orbit · scroll to zoom · height is colored from low (teal) to high (rust).</div>
    </aside>
  </div>
  <script src="./app.js"></script>
</body>
</html>
