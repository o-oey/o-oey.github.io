<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atolls — Maldives Sales</title><link rel="icon" href="/assets/logo-mark.svg"><link rel="stylesheet" href="/css/app.css"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet"></head><body><header class="ms-header" id="site-header"></header><main class="section" style="padding-top:36px"><div class="wrap"><p class="kicker" style="color:var(--tide)">Archipelago</p><h1 style="font-family:var(--serif);font-weight:360;font-size:clamp(2.4rem,6vw,4.6rem)">Twenty atolls.</h1><div class="grid grid-3" id="grid"></div></div></main><footer class="ms-footer" id="site-footer"></footer><script src="/js/catalog.js"></script><script src="/js/app.js"></script><script>MS.header('atolls');MS.footer();MS.api('/api/atolls').then(atolls=>{document.getElementById('grid').innerHTML=atolls.map(a=>`<a class="card" href="/atoll.html?code=${a.code}"><div class="card-body"><p class="kicker" style="color:var(--tide)">${a.code}</p><h3>${a.name}</h3><p class="meta">${a.desc}</p><p class="price">${a.properties} stays</p></div></a>`).join('')});</script></body></html>
