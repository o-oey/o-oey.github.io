<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Concierge — Maldives Sales</title><link rel="icon" href="/assets/logo-mark.svg"><link rel="stylesheet" href="/css/app.css"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet"></head><body><header class="ms-header" id="site-header"></header><main class="section" style="padding-top:36px"><div class="wrap" style="display:grid;gap:28px;max-width:720px"><p class="kicker" style="color:var(--tide)">The desk</p><h1 style="font-family:var(--serif);font-weight:360;font-size:clamp(2.4rem,6vw,4rem)">Tell us the week. We will name the island.</h1><form class="book-panel form" id="form"><label>Name</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>Dates</label><input name="dates"><label>What should the week feel like?</label><textarea name="message"></textarea><button class="btn btn-primary" type="submit">Send to Maldives Sales</button><p id="ok" class="note" hidden></p></form></div></main><footer class="ms-footer" id="site-footer"></footer><script src="/js/catalog.js"></script><script src="/js/app.js"></script><script>MS.header('concierge');MS.footer();document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target).entries());body.source='concierge';const data=await MS.post('/api/inquiries',body);const ok=document.getElementById('ok');ok.hidden=false;ok.textContent=data.message||data.error;});</script></body></html>
