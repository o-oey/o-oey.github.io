<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Status — Maldives Sales</title>
  <link rel="icon" href="/assets/logo-mark.svg">
  <link rel="stylesheet" href="/css/app.css">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="ms-header" id="site-header"></header>
  <main class="section" style="padding-top:36px">
    <div class="wrap">
      <p class="kicker" style="color:var(--tide)">Health</p>
      <h1 style="font-family:var(--serif);font-weight:360;font-size:clamp(2.2rem,5vw,3.6rem)">Desk status</h1>
      <pre id="out" class="book-panel" style="margin-top:24px;overflow:auto"></pre>
    </div>
  </main>
  <footer class="ms-footer" id="site-footer"></footer>
  <script src="/js/catalog.js"></script>
  <script src="/js/app.js"></script>
  <script>
    MS.header(); MS.footer();
    MS.api('/api/health').then((d) => {
      document.getElementById('out').textContent = JSON.stringify(d, null, 2);
    });
  </script>
</body>
</html>
