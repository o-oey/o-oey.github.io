<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collections — Maldives Sales</title><link rel="icon" href="/assets/logo-mark.svg"><link rel="stylesheet" href="/css/app.css"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet"></head><body><header class="ms-header" id="site-header"></header><main class="section" style="padding-top:28px"><div class="wrap"><p class="kicker" style="color:var(--tide)">Edits</p><h1 style="font-family:var(--serif);font-weight:360;font-size:clamp(2.4rem,6vw,4rem)">Six ways into the same water.</h1><div class="grid grid-3" id="cols" style="margin-top:28px"></div><div id="detail" style="margin-top:36px"></div></div></main><footer class="ms-footer" id="site-footer"></footer><script src="/js/catalog.js"></script><script src="/js/app.js"></script><script>MS.header('collections');MS.footer();const slug=new URLSearchParams(location.search).get('slug');MS.api('/api/collections').then(list=>{document.getElementById('cols').innerHTML=list.map(c=>`<a class="card" href="/collections.html?slug=${c.slug}"><div class="card-body"><p class="kicker" style="color:var(--tide)">${c.kicker}</p><h3>${c.title}</h3><p class="meta">${c.blurb}</p><p class="price">${c.count} stays</p></div></a>`).join('')});if(slug){MS.api('/api/collections/'+slug).then(c=>{document.getElementById('detail').innerHTML=`<h2 style="font-family:var(--serif);margin-bottom:16px">${c.title}</h2><div class="grid grid-3">${c.items.map(MS.card).join('')}</div>`;});}</script></body></html>
