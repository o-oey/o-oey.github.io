<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atoll — Maldives Sales</title><link rel="icon" href="/assets/logo-mark.svg"><link rel="stylesheet" href="/css/app.css"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet"></head><body><header class="ms-header" id="site-header"></header><main class="section" style="padding-top:28px"><div class="wrap" id="page"></div></main><footer class="ms-footer" id="site-footer"></footer><script src="/js/catalog.js"></script><script src="/js/app.js"></script><script>MS.header('atolls');MS.footer();const code=new URLSearchParams(location.search).get('code')||'K';MS.api('/api/atolls/'+encodeURIComponent(code)).then(a=>{document.title=a.name+' — Maldives Sales';document.getElementById('page').innerHTML=`<p class="kicker" style="color:var(--tide)">${a.code} · ${a.aka||''}</p><h1 style="font-family:var(--serif);font-weight:360;font-size:clamp(2.4rem,6vw,4.6rem)">${a.name}</h1><p class="muted" style="max-width:62ch;margin:10px 0 24px">${a.desc}</p><div class="grid grid-3">${(a.stays||[]).map(MS.card).join('')}</div>`;}).catch(()=>{document.getElementById('page').innerHTML='<p>Atoll not found.</p>'});</script></body></html>
