<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stays — Maldives Sales</title><link rel="icon" href="/assets/logo-mark.svg"><link rel="stylesheet" href="/css/app.css"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet"></head><body><header class="ms-header" id="site-header"></header><main class="section" style="padding-top:24px"><div class="wrap"><p class="kicker" style="color:var(--tide)">Catalogue</p><h1 style="font-family:var(--serif);font-weight:360;font-size:clamp(2.2rem,5vw,4rem)">Every stay we will sell.</h1><div class="filters" id="filters"><input id="q" placeholder="Name or island"><select id="atoll"><option value="">All atolls</option></select><select id="tier"><option value="">All tiers</option><option>Ultra Luxury</option><option>Luxury</option></select><select id="sort"><option value="">Recommended</option><option value="price-asc">Price low</option><option value="price-desc">Price high</option></select></div><p class="muted" id="count"></p><div class="grid grid-3" id="grid"></div></div></main><footer class="ms-footer" id="site-footer"></footer><script src="/js/catalog.js"></script><script src="/js/app.js"></script><script>MS.header('explorer');MS.footer();const $=id=>document.getElementById(id);MS.api('/api/atolls').then(list=>{$('atoll').innerHTML+=list.map(a=>`<option value="${a.code}">${a.name}</option>`).join('')});async function load(){const q=new URLSearchParams({q:$('q').value,atoll:$('atoll').value,tier:$('tier').value,sort:$('sort').value,limit:24});const data=await MS.api('/api/properties?'+q);$('count').textContent=data.total+' stays';$('grid').innerHTML=data.items.map(MS.card).join('')||'<p>No stays.</p>';}document.getElementById('filters').addEventListener('change',load);$('q').addEventListener('keydown',e=>{if(e.key==='Enter')load()});load();</script></body></html>
