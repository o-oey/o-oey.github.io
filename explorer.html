<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stays — Maldives Sales</title>
  <link rel="icon" href="/assets/logo-mark.svg">
  <link rel="stylesheet" href="/css/app.css">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<header class="ms-header" id="site-header"></header>
<main class="section" style="padding-top:24px">
  <div class="wrap">
    <p class="kicker" style="color:var(--tide)">Catalogue</p>
    <h1 style="font-family:var(--serif);font-weight:360;font-size:clamp(2.2rem,5vw,4rem)">Every stay on the desk.</h1>
    <p class="muted" id="sub" style="margin:8px 0 0">Featured static catalogue. Full inventory attaches when the Node API is live.</p>
    <div class="filters" id="filters">
      <input id="q" placeholder="Name or island">
      <select id="atoll"><option value="">All atolls</option></select>
      <select id="tier">
        <option value="">All tiers</option>
        <option>Ultra Luxury</option>
        <option>Luxury</option>
        <option>Premium</option>
        <option>Boutique</option>
        <option>Guesthouse</option>
      </select>
      <select id="transfer">
        <option value="">Any transfer</option>
        <option value="speedboat">Speedboat</option>
        <option value="seaplane">Seaplane</option>
        <option value="domestic">Domestic</option>
      </select>
      <select id="sort">
        <option value="">Recommended</option>
        <option value="price-asc">Price low</option>
        <option value="price-desc">Price high</option>
        <option value="rating">Rating</option>
      </select>
    </div>
    <p class="muted" id="count"></p>
    <div class="grid grid-3" id="grid"></div>
    <div id="pager" style="display:flex;gap:8px;justify-content:center;margin-top:28px"></div>
  </div>
</main>
<footer class="ms-footer" id="site-footer"></footer>
<script src="/js/catalog.js"></script>
<script src="/js/app.js"></script>
<script>
MS.header('explorer'); MS.footer();
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
let page = Number(params.get('page') || 1);
MS.api('/api/atolls').then((list) => {
  $('atoll').innerHTML += list.map((a) => `<option value="${a.code}">${a.name}</option>`).join('');
  if (params.get('atoll')) $('atoll').value = params.get('atoll');
});
if (params.get('q')) $('q').value = params.get('q');
if (params.get('tier')) $('tier').value = params.get('tier');
if (params.get('transfer')) $('transfer').value = params.get('transfer');
if (params.get('sort')) $('sort').value = params.get('sort');
async function load() {
  const q = new URLSearchParams({
    q: $('q').value,
    atoll: $('atoll').value,
    tier: $('tier').value,
    transfer: $('transfer').value,
    sort: $('sort').value,
    limit: 24,
    page
  });
  const data = await MS.api('/api/properties?' + q);
  $('count').textContent = data.total + ' stays · page ' + data.page + ' of ' + Math.max(data.pages, 1);
  $('grid').innerHTML = data.items.map(MS.card).join('') || '<p>No stays.</p>';
  const pages = Math.max(data.pages, 1);
  $('pager').innerHTML = Array.from({length: pages}, (_, i) => i + 1).map((n) =>
    `<button class="btn ${n===page?'btn-primary':'btn-ghost'}" data-p="${n}">${n}</button>`
  ).join('');
}
document.getElementById('filters').addEventListener('change', () => { page = 1; load(); });
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { page = 1; load(); } });
$('pager').addEventListener('click', (e) => {
  const b = e.target.closest('[data-p]');
  if (!b) return;
  page = Number(b.dataset.p);
  load();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
load();
</script>
</body>
</html>
